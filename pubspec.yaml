name: school_learning_app
description: >-
  Offline-first learning app for Classes 1-5 with letters, numbers, words,
  stories, quizzes, and gentle games on one shared home screen.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/catalog.json
    - assets/audio/lessons/
    - assets/audio/flashcards/
